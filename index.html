<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lima Field">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  
  <title>Lima Field</title>
<style>
:root{
  --bg:#101512;--panel:#171f1a;--panel2:#111814;--green:#37e06f;
  --text:#f4f6f4;--muted:#aab5ad;--danger:#ff5c6a;--amber:#ffc857;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;height:100%;overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
.topbar{
  height:calc(64px + var(--safe-top));padding:calc(6px + var(--safe-top)) 10px 6px;
  display:flex;align-items:center;gap:8px;background:rgba(16,21,18,.96);border-bottom:1px solid #253028;z-index:20
}
.brand-logo{height:46px;max-width:158px;object-fit:contain;object-position:left center}
.build-badge{font-size:9px;line-height:1;padding:4px 6px;border-radius:999px;background:#203027;color:#9ff3b8;font-weight:900;white-space:nowrap}
.topbar-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border:0;border-radius:12px;background:#202a23;color:white;font-size:20px;font-weight:700}
.icon-btn:active{transform:scale(.96)}
#gpsBtn.locating{color:var(--green);box-shadow:0 0 0 2px rgba(55,224,111,.28) inset;animation:gpsPulse 1s ease-in-out infinite alternate}
@keyframes gpsPulse{to{background:#294432;transform:scale(1.04)}}
#main{flex:1;overflow:auto;padding-bottom:calc(12px + var(--safe-bottom));scroll-padding-bottom:calc(12px + var(--safe-bottom));overscroll-behavior:contain}
.hidden{display:none!important}

.home-hero{padding:14px 16px 4px}
.kicker{font-size:12px;letter-spacing:1.4px;font-weight:800;color:var(--green)}
h1,h2,h3,p{margin-top:0}
h1{font-size:28px;margin-bottom:6px}
.muted{color:var(--muted)}
.primary{background:var(--green);color:#061008;border:0;border-radius:15px;padding:14px 18px;font-weight:900}
.secondary{background:#202a23;color:white;border:1px solid #334037;border-radius:14px;padding:12px 16px;font-weight:700}
.danger{background:#3d171b;color:#ff9fa7;border:1px solid #6d2a31}
.action-row{display:flex;gap:10px;flex-wrap:wrap}
.home-actions{display:flex;gap:9px;flex-wrap:wrap}
.card{margin:10px 12px;padding:15px;border-radius:18px;background:var(--panel);border:1px solid #263128}
.project-card{display:flex;align-items:center;gap:12px}
.project-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#1c3525;font-size:24px}
.project-card .grow{flex:1;min-width:0}
.project-card h3{margin:0 0 4px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-card p{margin:0;color:var(--muted);font-size:13px}
.chev{font-size:28px;color:#7d8a80}
.delete-project{width:38px;height:38px;border:1px solid #6d2a31;border-radius:12px;background:#301619;color:#ff9fa7;font-size:17px;display:grid;place-items:center}

.project-title{padding:8px 12px 0}
.project-title .kicker{font-size:10px;line-height:1.15}
.project-title h1{font-size:20px;line-height:1.1;margin-bottom:2px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px 9px 6px}
.quick-btn{min-height:46px;border:1px solid #2c382f;background:#151d18;color:white;border-radius:12px;font-size:9.5px;line-height:1.05;padding:4px 2px}
.quick-btn b{display:block;font-size:16px;line-height:1;margin-bottom:2px}
.quick-btn.active{background:var(--green);color:#041008}

.map-wrap{position:relative;margin:0 9px calc(10px + var(--safe-bottom));border-radius:18px;overflow:hidden;border:1px solid #2c372f;background:#1c241f;height:70vh;height:70dvh;min-height:520px;max-height:820px}
.map-wrap.map-immersive{position:fixed;inset:0;z-index:80;width:100vw;height:100vh;height:100dvh;min-height:0;max-width:none;max-height:none;margin:0;border:0;border-radius:0}
.map-wrap.map-immersive .map-layer-switch,.map-wrap.map-immersive .map-controls,.map-wrap.map-immersive .map-message,.map-wrap.map-immersive .draw-toolbar{visibility:hidden;opacity:0;pointer-events:none}
.map-wrap.map-immersive .coords-panel{bottom:calc(10px + var(--safe-bottom))}
.map-wrap.map-immersive .nav-compass{right:10px;top:calc(18px + var(--safe-top))}
.map-wrap.map-immersive .map-attribution{right:6px;bottom:calc(58px + var(--safe-bottom));max-width:60%;opacity:.55}
.map-stack{position:absolute;inset:0;overflow:hidden}
#baseMapCanvas,#fieldCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#baseMapCanvas{z-index:1;pointer-events:none}
#fieldCanvas{z-index:3;touch-action:none}
.geo-pdf-map-overlay{display:none;position:absolute;left:0;top:0;z-index:2;transform-origin:0 0;pointer-events:none;will-change:transform;background:white;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.geo-pdf-map-overlay iframe,.geo-pdf-map-overlay canvas{width:100%;height:100%;display:block;border:0;pointer-events:none;background:white}
.map-layer-switch{position:absolute;left:10px;right:10px;top:10px;z-index:8;display:flex;gap:6px;align-items:center;pointer-events:none}
.map-layer-switch button{pointer-events:auto;border:1px solid #405247;border-radius:11px;background:rgba(16,21,18,.93);color:#e7eee9;padding:8px 10px;font-size:11px;font-weight:900;white-space:nowrap}
.map-layer-switch button.active{background:var(--green);border-color:var(--green);color:#061008}
.map-layer-switch .layers-btn{margin-left:auto}
.layer-count{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:4px;padding:0 5px;border-radius:999px;background:#2a3a30;color:#b7f6c9;font-size:9px}
.map-controls{position:absolute;right:10px;top:96px;display:grid;gap:6px;z-index:7}
.map-controls button{width:38px;height:38px;border:1px solid #3c4d41;border-radius:12px;background:rgba(16,21,18,.92);color:white;font-size:22px;font-weight:900}
.map-gesture-hint{position:absolute;right:10px;top:12px;color:#dce5de;background:rgba(16,21,18,.78);border-radius:999px;padding:6px 9px;font-size:10px;pointer-events:none}
.map-message{position:absolute;left:10px;right:10px;top:53px;z-index:6;background:rgba(16,21,18,.89);border:1px solid #334238;border-radius:12px;padding:8px 10px;font-size:11px;pointer-events:none}
.map-center-reticle{position:absolute;left:50%;top:50%;z-index:5;width:30px;height:30px;transform:translate(-50%,-50%);border:2px solid #111713;border-radius:50%;background:rgba(255,255,255,.06);box-shadow:0 0 0 2px rgba(255,255,255,.96),0 2px 7px rgba(0,0,0,.72);pointer-events:none}
.map-center-reticle::before,.map-center-reticle::after{content:"";position:absolute;background:#111713;box-shadow:0 0 0 1px rgba(255,255,255,.96)}
.map-center-reticle::before{left:50%;top:-10px;width:2px;height:50px;transform:translateX(-50%)}
.map-center-reticle::after{left:-10px;top:50%;width:50px;height:2px;transform:translateY(-50%)}
.reticle-center{position:absolute;left:50%;top:50%;z-index:2;width:6px;height:6px;transform:translate(-50%,-50%);border:1px solid white;border-radius:50%;background:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.72)}
.coords-panel{position:absolute;left:50%;right:auto;bottom:10px;z-index:7;width:max-content;max-width:calc(100% - 34px);transform:translateX(-50%);background:transparent;border:0;border-radius:0;padding:4px 6px;box-shadow:none;backdrop-filter:none;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.98),0 0 4px rgba(0,0,0,.9)}
.coords-line{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.coords-target{flex:0 0 auto;color:var(--green);font-size:15px;line-height:1}
.coords-main{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850;font-size:11.5px;letter-spacing:.01em}
.coords-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px;color:#c3cbc5;margin-top:3px}
.accuracy{flex:0 0 auto;color:var(--green);font-size:8px;font-weight:950;letter-spacing:.04em;white-space:nowrap}
.area-pill{display:inline-block;margin-top:5px;color:var(--green);font-size:10px;font-weight:900}
.map-attribution{position:absolute;right:10px;bottom:70px;z-index:6;max-width:76%;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.62);color:#d9dfdb;font-size:8px;line-height:1.2;text-align:right;pointer-events:auto}
.map-attribution a{color:inherit;text-decoration:underline}
.draw-toolbar{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));z-index:29;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;max-width:560px;margin:0 auto;padding:7px;border:1px solid #3b4c41;border-radius:15px;background:rgba(9,14,11,.96);box-shadow:0 8px 24px rgba(0,0,0,.42);backdrop-filter:blur(10px)}
.draw-toolbar.measure-toolbar{grid-template-columns:repeat(3,minmax(0,1fr))}
.draw-toolbar button{min-width:0;min-height:42px;border:1px solid #3b4c41;border-radius:10px;background:#172019;color:white;padding:6px 3px;font-size:10px;line-height:1.05;font-weight:900}
.draw-toolbar .export{background:var(--green);border-color:var(--green);color:#061008}
.draw-toolbar button.danger{background:#3d171b;border-color:#6d2a31;color:#ffb0b7}
.draw-toolbar button:disabled{opacity:.42;cursor:not-allowed}
.draw-live{grid-column:1/-1;width:auto;padding:7px 9px;border-radius:10px;background:#101813;border:1px solid #33463a;color:#dff8e6;font-size:10px;line-height:1.2;font-weight:850}
.map-wrap.editing .coords-panel,.map-wrap.editing .map-center-reticle{display:none}

.nav-compass{position:absolute;right:12px;top:196px;z-index:7;width:132px;background:rgba(14,19,16,.9);border:1px solid var(--green);border-radius:18px;padding:10px;text-align:center}
.compass-dial{width:82px;height:82px;margin:auto;border-radius:50%;border:2px solid #bbc5bd;position:relative}
.compass-dial::before{content:"N";position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900}
.compass-arrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:38px solid var(--green);transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);filter:drop-shadow(0 1px 2px #000)}
.nav-distance{font-weight:900;margin-top:6px}
.nav-bearing{font-size:12px;color:var(--muted)}

.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}
.photo-card{border-radius:15px;overflow:hidden;background:var(--panel);border:1px solid #2a352d}
.photo-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo-card .meta{padding:8px;font-size:11px;color:var(--muted)}
.photo-card .meta strong{display:block;color:var(--text);font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:0 8px 8px}
.photo-actions button{min-width:0;max-width:100%;padding:9px 4px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-actions .deletePhoto{grid-column:1/-1}
.file-list{padding:9px}
.file-item{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid #263128}
.file-item .grow{flex:1;min-width:0}
.file-item .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.modal{border:0;background:transparent;color:var(--text);padding:0;width:100%;height:100%}
.modal::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(5px)}
.modal-card{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--safe-bottom));max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 28px);overflow:auto;background:#141b17;color:var(--text);border:1px solid #2d3931;border-radius:22px;padding:14px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal-head h2{margin:0;font-size:20px}
.modal-head .icon-btn{margin-left:auto}
.modal-card h3{color:var(--green);-webkit-text-fill-color:var(--green);font-size:21px;margin:18px 0 7px;font-weight:900}
.form-row{margin:10px 0}
.form-row label{display:block;font-size:13px;color:var(--green);-webkit-text-fill-color:var(--green);font-weight:750;margin:0 0 5px}
.form-row input,.form-row select{width:100%;border:1px solid #314037;border-radius:13px;padding:12px;background:#111713;color:white}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #263128}
.switch-row span{color:var(--green);-webkit-text-fill-color:var(--green);font-weight:850}
.switch-row input{width:22px;height:22px}
.small{font-size:12px}
.note{background:#202820;border-left:3px solid var(--green);padding:10px 12px;border-radius:10px;color:#cad3cc;font-size:12px}

.camera-layer{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column;overflow:hidden}
.camera-video{width:100%;height:100%;object-fit:cover;touch-action:none;transform-origin:center center;will-change:transform}
.camera-controls{position:absolute;inset:0;pointer-events:none}
.camera-close{position:absolute;top:calc(12px + var(--safe-top));left:12px;pointer-events:auto}
.camera-zoom{position:absolute;top:calc(14px + var(--safe-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;max-width:calc(100vw - 118px);padding:6px 8px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(7,11,8,.78);backdrop-filter:blur(8px);pointer-events:auto}
.camera-zoom button{width:34px;height:34px;flex:0 0 34px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:#172019;color:white;font-size:23px;font-weight:900;line-height:1}
.camera-zoom input{width:min(170px,34vw);accent-color:var(--green)}
.camera-zoom-value{min-width:39px;color:var(--green);font-size:12px;font-weight:1000;text-align:center}
.camera-shot{position:absolute;left:50%;bottom:calc(28px + var(--safe-bottom));transform:translateX(-50%);width:82px;height:82px;border-radius:50%;border:5px solid white;background:transparent;pointer-events:auto}
.camera-shot::after{content:"";position:absolute;inset:7px;background:var(--green);border-radius:50%}
.camera-info{position:absolute;top:calc(78px + var(--safe-top));right:15px;left:31%;color:white;font-weight:850;font-size:15px;line-height:1.3;text-align:right;text-shadow:0 1px 4px #000,0 0 2px #000}
.camera-info .lf{color:var(--green);font-size:20px;font-weight:1000}
.camera-brand-slot{width:min(205px,62vw);height:70px;display:flex;align-items:flex-end;justify-content:flex-end;margin:0 0 6px auto}
.camera-brand-logo{display:block;max-width:100%;max-height:70px;object-fit:contain;object-position:right bottom;opacity:1;filter:drop-shadow(1px 2px 3px rgba(0,0,0,.78));mix-blend-mode:normal}
.camera-direction{position:absolute;top:calc(84px + var(--safe-top));left:18px;width:92px;color:white;text-align:center;font-size:12px;font-weight:900;text-shadow:0 1px 4px #000,0 0 2px #000}
.camera-compass{position:relative;margin:0 auto 7px;width:76px;height:76px;border:2px solid white;border-radius:50%;filter:drop-shadow(0 1px 2px #000)}
.camera-compass::before{content:"N";position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900}
.camera-compass .arrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:31px solid var(--green);transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg)}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:#eef7f0;color:#0b160e;padding:10px 14px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:38px 28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#223128;color:#b8c4bb}
@media(max-width:360px){.quick-grid{grid-template-columns:repeat(4,1fr)}.quick-btn{font-size:9.5px}.map-layer-switch{gap:4px}.map-layer-switch button{padding:7px 6px;font-size:9.5px}}
@media(min-width:800px){.modal-card{left:50%;right:auto;transform:translateX(-50%);width:620px}.home-hero,.project-title{max-width:900px;margin:auto}.card{max-width:900px;margin-left:auto;margin-right:auto}.map-wrap{max-width:980px;margin-left:auto;margin-right:auto}.quick-grid{max-width:900px;margin:auto}}

.brand-text{display:flex;align-items:baseline;gap:7px;letter-spacing:.3px}
.brand-text strong{font-size:28px;color:#37e06f;font-weight:1000}
.brand-text span{font-size:23px;color:#eef2ef;font-weight:800}

.official-logo{
  height:48px !important;
  width:auto;
  max-width:178px !important;
  object-fit:contain;
  object-position:left center;
  border-radius:0;
  mix-blend-mode:normal;
}

</style>
</head>
<body>
  <div id="app">

function waitForGps(timeout=16000){
  if(state.gps&&Date.now()-state.gpsUpdatedAt<30000)return Promise.resolve(state.gps);
  return new Promise(resolve=>{

    waiter.timer=setTimeout(()=>{
      state.gpsWaiters=state.gpsWaiters.filter(w=>w!==waiter);
      resolve(state.gps);
    },timeout);
    state.gpsWaiters.push(waiter);
  });
}

}

  const binary=atob(base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return URL.createObjectURL(new Blob([bytes],{type}));

  state.savedPoints=Array.isArray(p.points)?p.points:[];

    state.activeGeoPdf={key:pdf.key,name:pdf.name,blob:pdf.blob,url:URL.createObjectURL(pdf.blob),geoRef,visible:p.geoPdfVisible!==false};

  if(state.activeTrack){if(!state.activeTrack.paused)acquireTrackWakeLock();setTimeout(()=>toast(`Rastreio recuperado • ${state.activeTrack?.points?.length||0} posições`,4200),0)}
}

function parseKml(text){

function bridgeLegacyTouches(element,ignoreSelector=''){
  if('PointerEvent' in window)return;
  const events={touchstart:'onpointerdown',touchmove:'onpointermove',touchend:'onpointerup',touchcancel:'onpointercancel'};
  for(const [touchName,pointerName] of Object.entries(events))element.addEventListener(touchName,ev=>{
    if(ignoreSelector&&ev.target.closest?.(ignoreSelector))return;ev.preventDefault();
    for(const touch of ev.changedTouches)element[pointerName]?.({pointerId:touch.identifier,clientX:touch.clientX,clientY:touch.clientY,target:ev.target,preventDefault(){}});
  },{passive:false});
}

function bindCanvas(canvas){

    if(!pointers.has(ev.pointerId)){if(state.mode==='draw'||state.mode==='measure'){const p=point(ev);state.drawHover=canvasToLatLon(p.x,p.y);drawMap();updateCoordPanel()}return}ev.preventDefault();
    const old=pointers.get(ev.pointerId),next=point(ev);next.startX=old.startX;next.startY=old.startY;next.lastX=old.x;next.lastY=old.y;pointers.set(ev.pointerId,next);
    if(pointers.size===1){
      const total=Math.hypot(next.x-next.startX,next.y-next.startY);
      if(total>5){moved=true;stopFollowing();panMap(next.x-old.x,next.y-old.y,canvas)}
      return;
    }
    const g=centerAndDistance();stopFollowing();
    if(lastCenter)panMap(g.center.x-lastCenter.x,g.center.y-lastCenter.y,canvas,false);
    if(lastDistance>0&&g.distance>0)zoomMapAt(g.distance/lastDistance,g.center.x,g.center.y,canvas,false);
    lastCenter=g.center;lastDistance=g.distance;drawMap();
  };

    {tag:0x001F,type:5,count:1,rats:[acc]}
  ];
  const ifd0Count=1, ifd0Size=2+12*ifd0Count+4, gpsIfdOffset=8+ifd0Size, gpsIfdSize=2+12*entries.length+4;
  let dataOffset=gpsIfdOffset+gpsIfdSize;
  const extras=[];
  for(const e of entries){
    const size=typeSize(e.type)*e.count;
    if(size>4){
      e.offset=dataOffset;
      let bytes;
      if(e.rats){bytes=new Uint8Array(e.rats.length*8);const dv=new DataView(bytes.buffer);e.rats.forEach((r,i)=>{dv.setUint32(i*8,r[0],true);dv.setUint32(i*8+4,r[1],true)})}
      else if(e.ascii){bytes=new TextEncoder().encode(e.ascii)}
      else bytes=new Uint8Array(size);
      extras.push({offset:dataOffset,bytes});dataOffset+=bytes.length;
    }
  }
  const tiff=new Uint8Array(dataOffset), dv=new DataView(tiff.buffer);
  tiff[0]=0x49;tiff[1]=0x49;dv.setUint16(2,42,true);dv.setUint32(4,8,true);
  dv.setUint16(8,1,true);
  let o=10;dv.setUint16(o,0x8825,true);dv.setUint16(o+2,4,true);dv.setUint32(o+4,1,true);dv.setUint32(o+8,gpsIfdOffset,true);dv.setUint32(8+2+12,0,true);
  dv.setUint16(gpsIfdOffset,entries.length,true);o=gpsIfdOffset+2;
  for(const e of entries){
    dv.setUint16(o,e.tag,true);dv.setUint16(o+2,e.type,true);dv.setUint32(o+4,e.count,true);
    const size=typeSize(e.type)*e.count;
    if(size<=4){
      const tmp=new Uint8Array(4); if(e.inline)tmp.set(e.inline.slice(0,4)); else if(e.ascii)tmp.set(new TextEncoder().encode(e.ascii).slice(0,4));
      tiff.set(tmp,o+8);
    }else dv.setUint32(o+8,e.offset,true);
    o+=12;
  }
  dv.setUint32(o,0,true); extras.forEach(x=>tiff.set(x.bytes,x.offset));
  const payload=new Uint8Array(6+tiff.length);payload.set(new Uint8Array([0x45,0x78,0x69,0x66,0,0]),0);payload.set(tiff,6);
  const seg=new Uint8Array(4+payload.length),sdv=new DataView(seg.buffer);seg[0]=0xFF;seg[1]=0xE1;sdv.setUint16(2,payload.length+2,false);seg.set(payload,4);return seg;
}
function typeSize(t){return t===1||t===2?1:t===3?2:t===4?4:t===5?8:1}
function degToDmsRational(d){const deg=Math.floor(d),mf=(d-deg)*60,min=Math.floor(mf),sec=(mf-min)*60;return [[deg,1],[min,1],[Math.round(sec*100000),100000]]}

/* Coordinates */
function coordFormat(lat,lon,fmt){
  if(fmt==='dd')return `${lat.toFixed(7)}, ${lon.toFixed(7)}`;
  if(fmt==='dms')return `${dms(lat,true)}  ${dms(lon,false)}`;
  if(fmt==='ddm')return `${ddm(lat,true)}  ${ddm(lon,false)}`;
  const u=toUtm(lat,lon,state.settings.utmAuto?null:+state.settings.utmZone);
  return `E ${u.e.toFixed(2)} | N ${u.n.toFixed(2)} | ${u.zone}${u.hemi}`;
}
function coordFormatCompact(lat,lon,fmt){
  if(fmt==='utm'){
    const u=toUtm(lat,lon,state.settings.utmAuto?null:+state.settings.utmZone);
    return `${u.zone}${u.hemi}  ${u.e.toFixed(0)}E  ${u.n.toFixed(0)}N`;
  }
  if(fmt==='dd')return `${lat.toFixed(7)}°, ${lon.toFixed(7)}°`;
  return coordFormat(lat,lon,fmt);
}
function dms(v,isLat){const a=Math.abs(v),d=Math.floor(a),mf=(a-d)*60,m=Math.floor(mf),s=(mf-m)*60,h=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');return `${String(d).padStart(2,'0')}°${String(m).padStart(2,'0')}'${s.toFixed(2)}"${h}`}
function ddm(v,isLat){const a=Math.abs(v),d=Math.floor(a),m=(a-d)*60,h=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');return `${String(d).padStart(2,'0')}°${m.toFixed(5)}'${h}`}
function toUtm(lat,lon,forcedZone){
  const zone=forcedZone||Math.floor((lon+180)/6)+1,lon0=(zone-1)*6-180+3;
  const a=6378137,invF=state.settings.datum==='sirgas2000'?298.257222101:298.257223563,f=1/invF,e2=f*(2-f),ep2=e2/(1-e2),k0=.9996;
  const r=Math.PI/180,phi=lat*r,lam=lon*r,lam0=lon0*r,s=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi),N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=c*(lam-lam0);
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*phi-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*phi)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*phi)-(35*e2**3/3072)*Math.sin(6*phi));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let North=k0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(lat<0)North+=10000000;
  return {e:E,n:North,zone,hemi:lat>=0?'N':'S'};
}
function areaConvert(sqm,u){
  if(u==='ha')return {value:sqm/10000,unit:'ha'};
  if(u==='alq_sp')return {value:sqm/24200,unit:'alq. paulista'};
  if(u==='alq_mg')return {value:sqm/48400,unit:'alqueirão'};
  if(u==='m2')return {value:sqm,unit:'m²'};
  return {value:sqm/state.settings.customAreaSqm,unit:state.settings.customAreaName};
}
function polygonArea(pts){
  if(pts.length<3)return 0;
  const avg=pts.reduce((s,p)=>s+p.lon,0)/pts.length,zone=Math.floor((avg+180)/6)+1;
  const xy=pts.map(p=>toUtm(p.lat,p.lon,zone));let a=0;
  for(let i=0;i<xy.length;i++){const p=xy[i],q=xy[(i+1)%xy.length];a+=p.e*q.n-q.e*p.n}return Math.abs(a)/2;
}
function polygonPerimeter(pts){let p=0;for(let i=0;i<pts.length;i++)p+=haversine(pts[i].lat,pts[i].lon,pts[(i+1)%pts.length].lat,pts[(i+1)%pts.length].lon);return p}
function haversine(a,b,c,d){const R=6371008.8,r=Math.PI/180,dp=(c-a)*r,dl=(d-b)*r,x=Math.sin(dp/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(a,b,c,d){const r=Math.PI/180,p1=a*r,p2=c*r,dl=(d-b)*r,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (Math.atan2(y,x)/r+360)%360}
function cardinal(h){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(((h%360)+360)%360/45)%8]}

/* Sensors */
async function requestSensors(includeOrientation=true){
  if(navigator.geolocation&&requestSensors._watch==null){
    requestSensors._watch=navigator.geolocation.watchPosition(pos=>{
      state.gps={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,altitude:pos.coords.altitude||0,speed:pos.coords.speed};
      state.gpsUpdatedAt=Date.now();
      recordTrackPosition(pos);
      if(state.followGps)setMapViewAroundGps(state.gps);
      const waiters=state.gpsWaiters.splice(0);waiters.forEach(w=>{clearTimeout(w.timer);w.resolve(state.gps)});
      updateCoordPanel();updateNavigation();drawMap();
    },err=>{
      if(requestSensors._watch!=null){try{navigator.geolocation.clearWatch(requestSensors._watch)}catch(_){}}
      requestSensors._watch=null;if(err.code===1)state.gps=null;
      gpsBtn.classList.remove('locating');
      const waiters=state.gpsWaiters.splice(0);waiters.forEach(w=>{clearTimeout(w.timer);w.resolve(null)});
      toast('GPS: '+err.message);
    },{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  }
  if(!includeOrientation)return;
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const res=await DeviceOrientationEvent.requestPermission();state.orientationGranted=res==='granted';
    }else state.orientationGranted=true;
    if(state.orientationGranted&&!requestSensors._ori){
      window.addEventListener('deviceorientation',e=>{
        let h=typeof e.webkitCompassHeading==='number'?e.webkitCompassHeading:(360-(e.alpha||0));
        state.heading=(h+360)%360;updateNavigation();
      },true);requestSensors._ori=true;
    }
  }catch(_){}
}
function recordTrackPosition(pos){
  const t=state.activeTrack;if(!t||t.paused||t.suspendedAt||!state.currentProjectId)return;
  const c=pos.coords,now=Date.now(),point={lat:c.latitude,lon:c.longitude,altitude:c.altitude||0,accuracy:c.accuracy,time:now},last=t.points.at(-1);
  if(c.accuracy>Math.max(35,state.settings.accuracyMedium*3))return;
  if(last&&now-(t.lastAcceptedAt||0)<2000&&haversine(last.lat,last.lon,point.lat,point.lon)<2)return;
  t.points.push(point);t.lastAcceptedAt=now;persistActiveTrack();
}
/* Settings */
function renderSettings(){
  openModal('Configurações',`
    <h3>Coordenadas</h3>
    ${selectRow('Principal','coordPrimary',[['utm','UTM'],['dms','Graus, minutos e segundos'],['dd','Graus decimais'],['ddm','Graus e minutos decimais']])}
    ${switchRow('Mostrar coordenada secundária','coordSecondaryEnabled')}
    ${selectRow('Secundária','coordSecondary',[['dms','Graus, minutos e segundos'],['dd','Graus decimais'],['utm','UTM'],['ddm','Graus e minutos decimais']])}
    ${selectRow('Datum','datum',[['sirgas2000','SIRGAS 2000'],['wgs84','WGS 84']])}
    ${switchRow('Fuso UTM automático','utmAuto')}
    <div class="form-row"><label>Fuso UTM manual</label><input id="utmZone" type="number" min="1" max="60" value="${state.settings.utmZone}"></div>
    <h3>Área</h3>
    ${selectRow('Unidade principal','areaPrimary',[['ha','Hectares'],['alq_sp','Alqueire paulista'],['alq_mg','Alqueirão / mineiro'],['m2','m²']])}
    ${switchRow('Mostrar unidade secundária','areaSecondaryEnabled')}
    ${selectRow('Unidade secundária','areaSecondary',[['alq_mg','Alqueirão / mineiro'],['alq_sp','Alqueire paulista'],['ha','Hectares'],['m2','m²']])}
    <div class="form-row"><label>Casas decimais</label><select id="areaDecimals">${[2,3,4,5,6].map(n=>`<option ${n==state.settings.areaDecimals?'selected':''}>${n}</option>`).join('')}</select></div>
    <h3>Foto</h3>
    ${switchRow('Mostrar altitude','showAltitudeOnPhoto')}
    ${switchRow('Solicitar salvamento no celular após fotografar','autoSaveToDevice')}
    <div class="note">“Mostrar coordenada secundária” controla também o carimbo da foto. No iPhone, o navegador abre o menu do sistema e você deve escolher “Salvar Imagem”; uma página web não pode gravar silenciosamente na galeria.</div>
    <br><div class="action-row"><button id="saveSettings" class="primary">Salvar</button>${state.currentProjectId?'<button id="deleteCurrentProject" class="secondary danger">Excluir este projeto</button>':''}</div>`);
  $('#saveSettings').onclick=()=>{
    ['coordPrimary','coordSecondary','datum','areaPrimary','areaSecondary'].forEach(k=>state.settings[k]=$('#'+k).value);
    ['coordSecondaryEnabled','utmAuto','areaSecondaryEnabled','showAltitudeOnPhoto','autoSaveToDevice'].forEach(k=>state.settings[k]=$('#'+k).checked);
    state.settings.showSecondaryOnPhoto=state.settings.coordSecondaryEnabled;
    state.settings.utmZone=+$('#utmZone').value||21;state.settings.areaDecimals=+$('#areaDecimals').value||4;saveState();modal.close();renderProjectOrHome();toast('Configurações salvas');
  };
  if($('#deleteCurrentProject'))$('#deleteCurrentProject').onclick=()=>{const id=state.currentProjectId;modal.close();confirmDeleteProject(id)};
}
function selectRow(label,key,opts){return `<div class="form-row"><label>${label}</label><select id="${key}">${opts.map(([v,t])=>`<option value="${v}" ${state.settings[key]===v?'selected':''}>${t}</option>`).join('')}</select></div>`}
function switchRow(label,key){return `<div class="switch-row"><span>${label}</span><input id="${key}" type="checkbox" ${state.settings[key]?'checked':''}></div>`}
function renderProjectOrHome(){state.photoMode?renderPhotoMode():state.currentProjectId?renderProject():renderHome()}

/* IndexedDB */
const DB='lima-field-db',VER=1;
const memoryDb={files:new Map(),photos:new Map()};let idbDisabled=false;
function dbOpen(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej(new Error('IndexedDB indisponível'));const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'key'});if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(store,val){
  memoryDb[store].set(val.key,val);if(idbDisabled)return false;
  try{const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});return true}catch(_){idbDisabled=true;return false}
}
async function idbGet(store,key){
  if(!idbDisabled)try{const db=await dbOpen(),item=await new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(item)return item}catch(_){idbDisabled=true}
  return memoryDb[store].get(key);
}
async function idbDelete(store,key){
  memoryDb[store].delete(key);if(idbDisabled)return false;
  try{const db=await dbOpen();await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)});return true}catch(_){idbDisabled=true;return false}
}
async function idbListByPrefix(store,prefix){
  let items=[];if(!idbDisabled)try{const db=await dbOpen();items=await new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(_){idbDisabled=true}
  const merged=new Map(items.map(x=>[x.key,x]));for(const [key,val] of memoryDb[store])if(key.startsWith(prefix))merged.set(key,val);return [...merged.values()].filter(x=>x.key.startsWith(prefix));
}
async function idbDeleteByPrefix(store,prefix){
  for(const key of [...memoryDb[store].keys()])if(key.startsWith(prefix))memoryDb[store].delete(key);
  if(idbDisabled)return false;
  try{const db=await dbOpen();await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite'),cursor=tx.objectStore(store).openCursor();cursor.onsuccess=()=>{const c=cursor.result;if(!c)return;if(String(c.key).startsWith(prefix))c.delete();c.continue()};tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)});return true}catch(_){idbDisabled=true;return false}
}

function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}


window.addEventListener('resize',()=>{const base=$('#baseMapCanvas'),c=$('#fieldCanvas');if(c){fitCanvas(base);fitCanvas(c);drawMap()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')suspendActiveTrack();else resumeActiveTrackAfterVisibility()});
window.addEventListener('pagehide',suspendActiveTrack);
window.addEventListener('pageshow',()=>{if(document.visibilityState==='visible')resumeActiveTrackAfterVisibility()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
renderHome();

</script>
