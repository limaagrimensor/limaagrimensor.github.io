<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lima Field">
  
  <title>Lima Field</title>
<style>
:root{
  --bg:#101512;--panel:#171f1a;--panel2:#111814;--green:#37e06f;
  --text:#f4f6f4;--muted:#aab5ad;--danger:#ff5c6a;--amber:#ffc857;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;height:100%;overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
.topbar{
  height:calc(74px + var(--safe-top));padding:calc(8px + var(--safe-top)) 12px 8px;
  display:flex;align-items:center;gap:10px;background:rgba(16,21,18,.96);border-bottom:1px solid #253028;z-index:20
}
.brand-logo{height:54px;max-width:180px;object-fit:contain;object-position:left center}
.build-badge{font-size:9px;line-height:1;padding:4px 6px;border-radius:999px;background:#203027;color:#9ff3b8;font-weight:900;white-space:nowrap}
.topbar-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border:0;border-radius:13px;background:#202a23;color:white;font-size:22px;font-weight:700}
.icon-btn:active{transform:scale(.96)}
#gpsBtn.locating{color:var(--green);box-shadow:0 0 0 2px rgba(55,224,111,.28) inset;animation:gpsPulse 1s ease-in-out infinite alternate}
@keyframes gpsPulse{to{background:#294432;transform:scale(1.04)}}
#main{flex:1;overflow:auto;padding-bottom:calc(76px + var(--safe-bottom))}
.hidden{display:none!important}

.home-hero{padding:14px 16px 4px}
.kicker{font-size:12px;letter-spacing:1.4px;font-weight:800;color:var(--green)}
h1,h2,h3,p{margin-top:0}
h1{font-size:28px;margin-bottom:6px}
.muted{color:var(--muted)}
.primary{background:var(--green);color:#061008;border:0;border-radius:15px;padding:14px 18px;font-weight:900}
.secondary{background:#202a23;color:white;border:1px solid #334037;border-radius:14px;padding:12px 16px;font-weight:700}
.danger{background:#3d171b;color:#ff9fa7;border:1px solid #6d2a31}
.action-row{display:flex;gap:10px;flex-wrap:wrap}
.card{margin:10px 12px;padding:15px;border-radius:18px;background:var(--panel);border:1px solid #263128}
.project-card{display:flex;align-items:center;gap:12px}
.project-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#1c3525;font-size:24px}
.project-card .grow{flex:1;min-width:0}
.project-card h3{margin:0 0 4px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-card p{margin:0;color:var(--muted);font-size:13px}
.chev{font-size:28px;color:#7d8a80}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);background:rgba(15,20,17,.97);display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid #273129;z-index:30
}
.bottom-nav button{border:0;background:transparent;color:#859087;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.bottom-nav button span{font-size:19px}
.bottom-nav button.active{color:var(--green);font-weight:800}

.project-title{padding:13px 14px 0}
.project-title h1{font-size:23px}
.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:9px}
.quick-btn{min-height:68px;border:1px solid #2c382f;background:#151d18;color:white;border-radius:15px;font-size:12px;padding:8px 4px}
.quick-btn b{display:block;font-size:22px;margin-bottom:4px}
.quick-btn.active{background:var(--green);color:#041008}

.map-wrap{position:relative;margin:0 9px 10px;border-radius:18px;overflow:hidden;border:1px solid #2c372f;background:#1c241f;height:54vh;min-height:360px}
#fieldCanvas{width:100%;height:100%;display:block;touch-action:none}
.map-controls{position:absolute;right:10px;top:58px;display:grid;gap:7px;z-index:5}
.map-controls button{width:42px;height:42px;border:1px solid #3c4d41;border-radius:13px;background:rgba(16,21,18,.92);color:white;font-size:24px;font-weight:900}
.map-gesture-hint{position:absolute;right:10px;top:12px;color:#dce5de;background:rgba(16,21,18,.78);border-radius:999px;padding:6px 9px;font-size:10px;pointer-events:none}
.map-message{position:absolute;left:12px;right:12px;top:12px;background:rgba(16,21,18,.89);border:1px solid #334238;border-radius:12px;padding:9px 11px;font-size:13px}
.coords-panel{position:absolute;left:9px;right:9px;bottom:9px;background:rgba(14,19,16,.9);border:1px solid #314036;border-radius:15px;padding:10px 12px;backdrop-filter:blur(8px)}
.coords-main{font-weight:800;font-size:13px}
.coords-sub{font-size:11px;color:#c3cbc5;margin-top:4px}
.accuracy{float:right;color:var(--green);font-weight:900}
.area-pill{display:inline-block;margin-top:7px;color:var(--green);font-weight:900}

.nav-compass{position:absolute;right:12px;top:56px;width:132px;background:rgba(14,19,16,.9);border:1px solid var(--green);border-radius:18px;padding:10px;text-align:center}
.compass-dial{width:82px;height:82px;margin:auto;border-radius:50%;border:2px solid #bbc5bd;position:relative}
.compass-dial::before{content:"N";position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900}
.compass-arrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:38px solid var(--green);transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);filter:drop-shadow(0 1px 2px #000)}
.nav-distance{font-weight:900;margin-top:6px}
.nav-bearing{font-size:12px;color:var(--muted)}

.pdf-view{position:relative;margin:10px;height:70vh;border-radius:18px;overflow:hidden;border:1px solid #2a372e;background:white;touch-action:none}
.pdf-stage{position:absolute;inset:0;transform-origin:0 0;will-change:transform;background:white}
.pdf-view iframe{width:100%;height:100%;border:0;pointer-events:none}
.pdf-view.georef{height:auto;max-height:none}
.pdf-gps-marker{display:none;position:absolute;z-index:8;width:24px;height:24px;border:4px solid white;border-radius:50%;background:var(--green);box-shadow:0 0 0 9px rgba(55,224,111,.22),0 2px 8px #000;transform:translate(-50%,-50%);pointer-events:none}
.pdf-gps-marker.visible{display:block;animation:markerPulse 1s ease-in-out infinite alternate}
@keyframes markerPulse{to{box-shadow:0 0 0 15px rgba(55,224,111,.08),0 2px 8px #000}}
.pdf-live{display:inline-flex;align-items:center;gap:7px;color:#9ff3b8;font-weight:900;font-size:12px}
.pdf-live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(55,224,111,.14)}
.info-banner{margin:10px 12px;padding:11px 13px;border-radius:14px;background:#18231d;border:1px solid #2f4135;font-size:13px}

.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}
.photo-card{border-radius:15px;overflow:hidden;background:var(--panel);border:1px solid #2a352d}
.photo-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo-card .meta{padding:8px;font-size:11px;color:var(--muted)}
.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 8px 8px}
.photo-actions button{padding:10px 7px;font-size:11px}
.file-list{padding:9px}
.file-item{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid #263128}
.file-item .grow{flex:1;min-width:0}
.file-item .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.modal{border:0;background:transparent;padding:0;width:100%;height:100%}
.modal::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(5px)}
.modal-card{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--safe-bottom));max-height:86vh;overflow:auto;background:#141b17;border:1px solid #2d3931;border-radius:22px;padding:14px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal-head h2{margin:0;font-size:20px}
.modal-head .icon-btn{margin-left:auto}
.form-row{margin:10px 0}
.form-row label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
.form-row input,.form-row select{width:100%;border:1px solid #314037;border-radius:13px;padding:12px;background:#111713;color:white}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #263128}
.switch-row input{width:22px;height:22px}
.small{font-size:12px}
.note{background:#202820;border-left:3px solid var(--green);padding:10px 12px;border-radius:10px;color:#cad3cc;font-size:12px}

.camera-layer{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column}
.camera-video{width:100%;height:100%;object-fit:cover}
.camera-controls{position:absolute;inset:0;pointer-events:none}
.camera-close{position:absolute;top:calc(12px + var(--safe-top));left:12px;pointer-events:auto}
.camera-shot{position:absolute;left:50%;bottom:calc(28px + var(--safe-bottom));transform:translateX(-50%);width:82px;height:82px;border-radius:50%;border:5px solid white;background:transparent;pointer-events:auto}
.camera-shot::after{content:"";position:absolute;inset:7px;background:var(--green);border-radius:50%}
.camera-info{position:absolute;left:15px;right:112px;bottom:calc(128px + var(--safe-bottom));color:white;font-weight:800;font-size:13px;text-shadow:0 1px 4px #000,0 0 2px #000}
.camera-info .lf{color:var(--green);font-size:18px;font-weight:1000}
.camera-brand-slot{width:min(190px,58vw);height:64px;display:flex;align-items:flex-end;margin-bottom:5px}
.camera-brand-logo{display:block;max-width:100%;max-height:64px;object-fit:contain;object-position:left bottom;opacity:.85;mix-blend-mode:normal}
.camera-compass{position:absolute;right:20px;bottom:calc(132px + var(--safe-bottom));width:76px;height:76px;border:2px solid white;border-radius:50%;filter:drop-shadow(0 1px 2px #000)}
.camera-compass::before{content:"N";position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900}
.camera-compass .arrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:31px solid var(--green);transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg)}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:#eef7f0;color:#0b160e;padding:10px 14px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:38px 28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#223128;color:#b8c4bb}
@media(max-width:360px){.quick-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.modal-card{left:50%;right:auto;transform:translateX(-50%);width:620px}.home-hero,.project-title{max-width:900px;margin:auto}.card{max-width:900px;margin-left:auto;margin-right:auto}.map-wrap{max-width:980px;margin-left:auto;margin-right:auto}.quick-grid{max-width:900px;margin:auto}}

.brand-text{display:flex;align-items:baseline;gap:7px;letter-spacing:.3px}
.brand-text strong{font-size:28px;color:#37e06f;font-weight:1000}
.brand-text span{font-size:23px;color:#eef2ef;font-weight:800}

.official-logo{
  height:58px !important;
  width:auto;
  max-width:230px !important;
  object-fit:contain;
  object-position:left center;
  border-radius:0;
  mix-blend-mode:normal;
}

</style>
</head>

    <main id="main"></main>

  <script>
/* Lima Field PWA Beta 0.2.1 - no external libraries */

const BUILD_VERSION = '0.2.1';
const $ = s => document.querySelector(s);
const main = $('#main');
const bottomNav = $('#bottomNav');
const backBtn = $('#backBtn');
const settingsBtn = $('#settingsBtn');
const gpsBtn = $('#gpsBtn');
const modal = $('#modal');
const modalTitle = $('#modalTitle');
const modalBody = $('#modalBody');
const toastEl = $('#toast');
const buildBadge=document.createElement('span');
buildBadge.className='build-badge';buildBadge.textContent=`v${BUILD_VERSION}`;
document.querySelector('.topbar-actions').before(buildBadge);

const state = {
  projects: JSON.parse(localStorage.getItem('lf_projects') || '[]'),
  currentProjectId: null,
  tab: 'map',
  gps: null,
  heading: 0,
  orientationGranted: false,
  mode: 'browse',
  drawPoints: [],
  destination: null,
  mapFeatures: [],
  mapView: null,
  followGps: false,
  gpsUpdatedAt: 0,
  gpsWaiters: [],
  activeGeoPdf: null,
  settings: Object.assign({
    coordPrimary: 'utm',
    coordSecondaryEnabled: true,
    coordSecondary: 'dms',
    datum: 'sirgas2000',
    utmAuto: true,
    utmZone: 21,
    areaPrimary: 'ha',
    areaSecondaryEnabled: true,
    areaSecondary: 'alq_mg',
    areaDecimals: 4,
    customAreaName: 'Unidade',
    customAreaSqm: 10000,
    showSecondaryOnPhoto: true,
    showAltitudeOnPhoto: true,
    autoSaveToDevice: true,
    accuracyGood: 5,
    accuracyMedium: 10
  }, JSON.parse(localStorage.getItem('lf_settings') || '{}'))
};

function saveState(){
  localStorage.setItem('lf_projects', JSON.stringify(state.projects));
  localStorage.setItem('lf_settings', JSON.stringify(state.settings));
}
function currentProject(){ return state.projects.find(p=>p.id===state.currentProjectId); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function toast(msg,duration=2600){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),duration);
}

function openModal(title, html){
  modalTitle.textContent = title; modalBody.innerHTML = html; modal.showModal();
}
$('#modalClose').onclick=()=>modal.close();

backBtn.onclick=()=>{
  if(state.currentProjectId){ state.currentProjectId=null; state.tab='map'; renderHome(); }
};
settingsBtn.onclick=()=>renderSettings();
gpsBtn.onclick=locateMe;
bottomNav.addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b)return;
  state.tab=b.dataset.tab; renderProject();
});

async function locateMe(){
  if(!navigator.geolocation){toast('GPS indisponível neste modo. Abra o app por uma conexão segura (HTTPS).',5000);return}
  gpsBtn.classList.add('locating');
  await requestSensors();
  const gps=await waitForGps(16000);
  gpsBtn.classList.remove('locating');
  if(!gps){toast('Não foi possível obter sua localização. Verifique a permissão do GPS.');return}
  if(!state.currentProjectId){toast(`GPS ± ${gps.accuracy.toFixed(1)} m`);return}
  if(state.activeGeoPdf&&$('#geoPdfView')&&focusGeoPdfOnGps(gps))return;
  state.followGps=true;
  setMapViewAroundGps(gps);
  state.tab='map';
  renderProject();
  toast(`Mapa centralizado na sua posição • ± ${gps.accuracy.toFixed(1)} m`);
}

function waitForGps(timeout=16000){
  if(state.gps&&Date.now()-state.gpsUpdatedAt<30000)return Promise.resolve(state.gps);
  return new Promise(resolve=>{
    const waiter={resolve,timer:null};
    waiter.timer=setTimeout(()=>{
      state.gpsWaiters=state.gpsWaiters.filter(w=>w!==waiter);
      resolve(state.gps);
    },timeout);
    state.gpsWaiters.push(waiter);
  });
}

function setMapViewAroundGps(gps,radiusMeters=220){
  const lat=gps.latitude,lon=gps.longitude;
  const dLat=radiusMeters/111320;
  const dLon=radiusMeters/(111320*Math.max(.2,Math.cos(lat*Math.PI/180)));
  state.mapView={minLat:lat-dLat,maxLat:lat+dLat,minLon:lon-dLon,maxLon:lon+dLon};
}

function renderHome(){
  backBtn.classList.add('hidden'); bottomNav.classList.add('hidden');
  main.innerHTML = `
    <section class="home-hero">
      <div class="kicker">CAMPO OFFLINE • v${BUILD_VERSION}</div>
      <h1>Seus projetos</h1>
      <p class="muted">GeoPDF, GPS, fotos, KML e medições em um só lugar.</p>
      <button id="newProject" class="primary">+ Novo projeto</button>
    </section>
    <section id="projectList"></section>`;
  $('#newProject').onclick=createProjectModal;
  const list=$('#projectList');
  if(!state.projects.length){list.innerHTML='<div class="empty">Crie o primeiro projeto para começar.</div>';return}
  list.innerHTML=state.projects.map(p=>`
    <div class="card project-card" data-id="${p.id}">
      <div class="project-icon">🗺️</div>
      <div class="grow"><h3>${esc(p.name)}</h3><p>${p.photos||0} fotos • ${p.geoPdfName?'GeoPDF carregado':'sem GeoPDF'}</p></div>
      <div class="chev">›</div>
    </div>`).join('');
  list.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{
    state.currentProjectId=el.dataset.id; state.tab='map'; state.drawPoints=[]; state.destination=null; state.mapFeatures=[];
    state.mapView=null;state.followGps=false;
    renderProject(); requestSensors();
  });
}

function createProjectModal(){
  openModal('Novo projeto',`
    <div class="form-row"><label>Nome do imóvel / projeto</label><input id="pname" placeholder="Ex.: Fazenda Santa Maria" autofocus></div>
    <div class="action-row"><button id="createP" class="primary">Criar</button></div>`);
  $('#createP').onclick=()=>{
    const name=$('#pname').value.trim(); if(!name)return;
    state.projects.unshift({id:uid(),name,photos:0,createdAt:new Date().toISOString(),geoPdfName:null,kmlNames:[]});
    saveState(); modal.close(); renderHome();
  };
}

function renderProject(){
  const p=currentProject(); if(!p){renderHome();return}
  backBtn.classList.remove('hidden'); bottomNav.classList.remove('hidden');
  [...bottomNav.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='map') renderMapTab();
  if(state.tab==='photos') renderPhotosTab();
  if(state.tab==='files') renderFilesTab();
}

function projectHeader(){
  const p=currentProject();
  return `<section class="project-title"><div class="kicker">PROJETO</div><h1>${esc(p.name)}</h1></section>`;
}

async function parseGeoPdfReference(blob){
  try{
    const bytes=new Uint8Array(await blob.arrayBuffer()),decoder=new TextDecoder('latin1'),raw=decoder.decode(bytes);
    const sources=[raw,...await inflateGeoPdfStreams(bytes,raw,decoder)];
    const defaultMedia=parsePdfNumberArray(raw,'MediaBox');
    for(const text of sources){
      let from=0;
      while((from=text.indexOf('/GPTS',from))>=0){
        const near=text.slice(Math.max(0,from-12000),Math.min(text.length,from+24000));from+=5;
        const gpts=parsePdfNumberArray(near,'GPTS'),lpts=parsePdfNumberArray(near,'LPTS');
        if(!gpts||!lpts||gpts.length<6||lpts.length<6)continue;
        const bbox=parsePdfNumberArray(near,'BBox')||defaultMedia||[0,0,1,1];
        const mediaBox=parsePdfNumberArray(near,'MediaBox')||defaultMedia||bbox;
        if(bbox.length<4||mediaBox.length<4)continue;
        const n=Math.min(Math.floor(gpts.length/2),Math.floor(lpts.length/2)),points=[];
        for(let i=0;i<n;i++)points.push({lat:gpts[i*2],lon:gpts[i*2+1],x:lpts[i*2],y:lpts[i*2+1]});
        const candidates=[points,points.map(p=>({lat:p.lon,lon:p.lat,x:p.x,y:p.y}))].filter(ps=>ps.every(p=>Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180));

}

function applyPdfTransform(){
  const active=state.activeGeoPdf,view=$('#geoPdfView'),stage=$('#pdfStage');if(!active||!view||!stage)return;

  active.x=Math.min(0,Math.max(r.width-r.width*s,active.x));active.y=Math.min(0,Math.max(r.height-r.height*s,active.y));

function focusGeoPdfOnGps(gps,silent=false){
  const active=state.activeGeoPdf,ref=active?.geoRef,view=$('#geoPdfView'),marker=$('#pdfGpsMarker');
  if(!ref||!view||!marker)return false;
  const b=ref.bbox,m=ref.mediaBox,project=(ax,ay)=>{const apply=(coef)=>coef[0]*gps.longitude+coef[1]*gps.latitude+coef[2],lx=apply(ax),ly=apply(ay),pageX=b[0]+lx*(b[2]-b[0]),pageY=b[1]+ly*(b[3]-b[1]);return {x:(pageX-m[0])/(m[2]-m[0]),y:1-(pageY-m[1])/(m[3]-m[1])}};
  const candidates=[project(ref.affineX,ref.affineY)];if(ref.altAffineX&&ref.altAffineY)candidates.push(project(ref.altAffineX,ref.altAffineY));
  const point=candidates.find(p=>p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1)||candidates[0],x=point.x,y=point.y;
  active.following=true;
  const live=$('#pdfLiveStatus');if(live){live.className='pdf-live';live.textContent='Acompanhando em tempo real'}
  if(x<0||x>1||y<0||y>1){marker.classList.remove('visible');if(live)live.textContent='Acompanhando • posição fora desta folha';if(!silent)toast('Sua localização está fora da área desta folha GeoPDF');return true}
  const rect=view.getBoundingClientRect(),pageW=Math.abs(ref.mediaBox[2]-ref.mediaBox[0]),pageH=Math.abs(ref.mediaBox[3]-ref.mediaBox[1]),pageRatio=pageW/Math.max(1,pageH),viewRatio=rect.width/Math.max(1,rect.height);

  const markerX=offsetX+x*contentW,markerY=offsetY+y*contentH;marker.style.left=`${markerX}px`;marker.style.top=`${markerY}px`;marker.classList.add('visible');
  if(!silent)active.centerOnGps=true;
  if(active.centerOnGps&&active.scale>1){active.x=rect.width/2-markerX*active.scale;active.y=rect.height/2-markerY*active.scale;applyPdfTransform()}
  if(!silent){view.scrollIntoView({behavior:'smooth',block:'center'});toast(`Posição acompanhada no GeoPDF • ± ${gps.accuracy.toFixed(1)} m`)}

}

async function importKml(){
  const input=document.createElement('input'); input.type='file'; input.accept='.kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz';
  input.onchange=async()=>{
    const file=input.files[0]; if(!file)return;
    if(file.name.toLowerCase().endsWith('.kmz')){
      toast('KMZ está na lista do app, mas neste beta web use KML para visualizar a camada.');
      const p=currentProject(); p.kmlNames=[...(p.kmlNames||[]),file.name]; saveState(); return;
    }
    const text=await file.text();
    const features=parseKml(text);
    state.mapFeatures.push(...features);
    const p=currentProject(); p.kmlNames=[...(p.kmlNames||[]),file.name]; saveState();
    await idbPut('files',{key:`kml:${p.id}:${uid()}`,blob:file,name:file.name,type:file.type});
    state.mapView=null;state.followGps=false;toast(`${features.length} elemento(s) importado(s)`); renderMapTab();
  };
  input.click();
}

function parseKml(text){
  const xml=new DOMParser().parseFromString(text,'text/xml');
  const features=[];
  [...xml.querySelectorAll('Placemark')].forEach(pm=>{
    const name=pm.querySelector('name')?.textContent?.trim()||'Sem nome';
    const add=(sel,type)=>{
      pm.querySelectorAll(sel).forEach(node=>{
        const c=node.querySelector('coordinates')?.textContent||'';
        const pts=parseCoords(c); if(pts.length) features.push({name,type,points:pts});
      });
    };
    add('Point','point'); add('LineString','line'); add('Polygon','polygon');
  });
  return features;
}
function parseCoords(text){
  return text.trim().split(/\s+/).map(s=>s.split(',')).map(a=>({lon:+a[0],lat:+a[1]})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));
}

function bindCanvas(canvas){
  const pointers=new Map();
  let moved=false,usedMulti=false,lastCenter=null,lastDistance=0;
  const point=ev=>{const r=canvas.getBoundingClientRect();return {x:(ev.clientX-r.left)*canvas.width/r.width,y:(ev.clientY-r.top)*canvas.height/r.height}};
  const centerAndDistance=()=>{const a=[...pointers.values()].slice(0,2),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;return {center:{x:cx,y:cy},distance:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}};
  const stopFollowing=()=>{if(!state.followGps)return;state.followGps=false;const msg=$('#mapMessage');if(msg)msg.textContent='Mapa movido manualmente. Toque na mira para voltar à sua posição.'};
  canvas.onpointerdown=ev=>{
    ev.preventDefault();canvas.setPointerCapture?.(ev.pointerId);
    const p=point(ev);p.startX=p.x;p.startY=p.y;p.lastX=p.x;p.lastY=p.y;pointers.set(ev.pointerId,p);
    if(pointers.size===1){moved=false;usedMulti=false}
    if(pointers.size>=2){usedMulti=true;moved=true;const g=centerAndDistance();lastCenter=g.center;lastDistance=g.distance}

      return;
    }
    const g=centerAndDistance();stopFollowing();
    if(lastCenter)panMap(g.center.x-lastCenter.x,g.center.y-lastCenter.y,canvas,false);
    if(lastDistance>0&&g.distance>0)zoomMapAt(g.distance/lastDistance,g.center.x,g.center.y,canvas,false);
    lastCenter=g.center;lastDistance=g.distance;drawMap();
  };

    if(!pointers.has(ev.pointerId))return;
    const p=pointers.get(ev.pointerId),wasSingle=pointers.size===1;
    pointers.delete(ev.pointerId);

      const ll=canvasToLatLon(p.x,p.y);
      if(ll&&state.mode==='draw'){state.drawPoints.push(ll);drawMap();updateCoordPanel()}
      else if(ll&&state.mode==='dest'){state.destination=ll;state.mode='browse';drawMap();updateNavigation()}
    }
    if(pointers.size===1){const remain=[...pointers.values()][0];remain.startX=remain.x;remain.startY=remain.y;lastCenter=null;lastDistance=0}

function currentMapView(){
  const b=mapBounds();return {minLat:b.minLat,maxLat:b.maxLat,minLon:b.minLon,maxLon:b.maxLon};
}
function panMap(dx,dy,canvas,redraw=true){
  const b=currentMapView(),lonSpan=b.maxLon-b.minLon,latSpan=b.maxLat-b.minLat;
  const dLon=-dx/Math.max(1,canvas.width)*lonSpan,dLat=dy/Math.max(1,canvas.height)*latSpan;
  state.mapView={minLat:b.minLat+dLat,maxLat:b.maxLat+dLat,minLon:b.minLon+dLon,maxLon:b.maxLon+dLon};
  if(redraw)drawMap();

  const pad=26,rx=Math.max(0,Math.min(1,(x-pad)/Math.max(1,canvas.width-2*pad))),ry=Math.max(0,Math.min(1,(y-pad)/Math.max(1,canvas.height-2*pad)));
  const oldLon=b.maxLon-b.minLon,oldLat=b.maxLat-b.minLat,newLon=Math.max(1e-7,Math.min(360,oldLon/factor)),newLat=Math.max(1e-7,Math.min(170,oldLat/factor));

  if(state.mapView)return state.mapView;

  state.mapFeatures.forEach(f=>pts.push(...f.points));
  pts.push(...state.drawPoints);
  if(state.gps)pts.push({lat:state.gps.latitude,lon:state.gps.longitude});

    if(!img.naturalWidth)return null;
    const scan=document.createElement('canvas'),max=900,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    scan.width=Math.max(1,Math.round(img.naturalWidth*ratio));scan.height=Math.max(1,Math.round(img.naturalHeight*ratio));
    const sctx=scan.getContext('2d',{willReadFrequently:true});sctx.drawImage(img,0,0,scan.width,scan.height);
    const data=sctx.getImageData(0,0,scan.width,scan.height).data;
    let minX=scan.width,minY=scan.height,maxX=0,maxY=0;
    for(let y=0;y<scan.height;y+=2)for(let x=0;x<scan.width;x+=2){const i=(y*scan.width+x)*4,r=data[i],g=data[i+1],b=data[i+2],bright=Math.max(r,g,b);if(bright>32){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}

  })();

  const entries=[
    {tag:0x0000,type:1,count:4,inline:new Uint8Array([2,3,0,0])},
    {tag:0x0001,type:2,count:2,ascii:latRef},
    {tag:0x0002,type:5,count:3,rats:lat},
    {tag:0x0003,type:2,count:2,ascii:lonRef},
    {tag:0x0004,type:5,count:3,rats:lon},
    {tag:0x0005,type:1,count:1,inline:new Uint8Array([gps.altitude<0?1:0])},
    {tag:0x0006,type:5,count:1,rats:[alt]},
    {tag:0x0007,type:5,count:3,rats:t},
    {tag:0x0010,type:2,count:2,ascii:'T\0'},
    {tag:0x0011,type:5,count:1,rats:[dir]},
    {tag:0x001D,type:2,count:gpsDate.length,ascii:gpsDate},
    {tag:0x001F,type:5,count:1,rats:[acc]}
  ];
  const ifd0Count=1, ifd0Size=2+12*ifd0Count+4, gpsIfdOffset=8+ifd0Size, gpsIfdSize=2+12*entries.length+4;
  let dataOffset=gpsIfdOffset+gpsIfdSize;
  const extras=[];
  for(const e of entries){
    const size=typeSize(e.type)*e.count;
    if(size>4){
      e.offset=dataOffset;
      let bytes;
      if(e.rats){bytes=new Uint8Array(e.rats.length*8);const dv=new DataView(bytes.buffer);e.rats.forEach((r,i)=>{dv.setUint32(i*8,r[0],true);dv.setUint32(i*8+4,r[1],true)})}
      else if(e.ascii){bytes=new TextEncoder().encode(e.ascii)}
      else bytes=new Uint8Array(size);
      extras.push({offset:dataOffset,bytes});dataOffset+=bytes.length;
    }
  }
  const tiff=new Uint8Array(dataOffset), dv=new DataView(tiff.buffer);
  tiff[0]=0x49;tiff[1]=0x49;dv.setUint16(2,42,true);dv.setUint32(4,8,true);
  dv.setUint16(8,1,true);
  let o=10;dv.setUint16(o,0x8825,true);dv.setUint16(o+2,4,true);dv.setUint32(o+4,1,true);dv.setUint32(o+8,gpsIfdOffset,true);dv.setUint32(8+2+12,0,true);
  dv.setUint16(gpsIfdOffset,entries.length,true);o=gpsIfdOffset+2;
  for(const e of entries){
    dv.setUint16(o,e.tag,true);dv.setUint16(o+2,e.type,true);dv.setUint32(o+4,e.count,true);
    const size=typeSize(e.type)*e.count;
    if(size<=4){
      const tmp=new Uint8Array(4); if(e.inline)tmp.set(e.inline.slice(0,4)); else if(e.ascii)tmp.set(new TextEncoder().encode(e.ascii).slice(0,4));
      tiff.set(tmp,o+8);
    }else dv.setUint32(o+8,e.offset,true);
    o+=12;
  }
  dv.setUint32(o,0,true); extras.forEach(x=>tiff.set(x.bytes,x.offset));
  const payload=new Uint8Array(6+tiff.length);payload.set(new Uint8Array([0x45,0x78,0x69,0x66,0,0]),0);payload.set(tiff,6);
  const seg=new Uint8Array(4+payload.length),sdv=new DataView(seg.buffer);seg[0]=0xFF;seg[1]=0xE1;sdv.setUint16(2,payload.length+2,false);seg.set(payload,4);return seg;
}
function typeSize(t){return t===1||t===2?1:t===3?2:t===4?4:t===5?8:1}
function degToDmsRational(d){const deg=Math.floor(d),mf=(d-deg)*60,min=Math.floor(mf),sec=(mf-min)*60;return [[deg,1],[min,1],[Math.round(sec*100000),100000]]}

/* Coordinates */
function coordFormat(lat,lon,fmt){
  if(fmt==='dd')return `${lat.toFixed(7)}, ${lon.toFixed(7)}`;
  if(fmt==='dms')return `${dms(lat,true)}  ${dms(lon,false)}`;
  if(fmt==='ddm')return `${ddm(lat,true)}  ${ddm(lon,false)}`;
  const u=toUtm(lat,lon,state.settings.utmAuto?null:+state.settings.utmZone);
  return `E ${u.e.toFixed(2)} | N ${u.n.toFixed(2)} | ${u.zone}${u.hemi}`;
}
function dms(v,isLat){const a=Math.abs(v),d=Math.floor(a),mf=(a-d)*60,m=Math.floor(mf),s=(mf-m)*60,h=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');return `${String(d).padStart(2,'0')}°${String(m).padStart(2,'0')}'${s.toFixed(2)}"${h}`}
function ddm(v,isLat){const a=Math.abs(v),d=Math.floor(a),m=(a-d)*60,h=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');return `${String(d).padStart(2,'0')}°${m.toFixed(5)}'${h}`}
function toUtm(lat,lon,forcedZone){
  const zone=forcedZone||Math.floor((lon+180)/6)+1,lon0=(zone-1)*6-180+3;
  const a=6378137,invF=state.settings.datum==='sirgas2000'?298.257222101:298.257223563,f=1/invF,e2=f*(2-f),ep2=e2/(1-e2),k0=.9996;
  const r=Math.PI/180,phi=lat*r,lam=lon*r,lam0=lon0*r,s=Math.sin(phi),c=Math.cos(phi),t=Math.tan(phi),N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=c*(lam-lam0);
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*phi-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*phi)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*phi)-(35*e2**3/3072)*Math.sin(6*phi));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let North=k0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));if(lat<0)North+=10000000;
  return {e:E,n:North,zone,hemi:lat>=0?'N':'S'};
}
function areaConvert(sqm,u){
  if(u==='ha')return {value:sqm/10000,unit:'ha'};
  if(u==='alq_sp')return {value:sqm/24200,unit:'alq. paulista'};
  if(u==='alq_mg')return {value:sqm/48400,unit:'alqueirão'};
  if(u==='m2')return {value:sqm,unit:'m²'};
  return {value:sqm/state.settings.customAreaSqm,unit:state.settings.customAreaName};
}
function polygonArea(pts){
  if(pts.length<3)return 0;
  const avg=pts.reduce((s,p)=>s+p.lon,0)/pts.length,zone=Math.floor((avg+180)/6)+1;
  const xy=pts.map(p=>toUtm(p.lat,p.lon,zone));let a=0;
  for(let i=0;i<xy.length;i++){const p=xy[i],q=xy[(i+1)%xy.length];a+=p.e*q.n-q.e*p.n}return Math.abs(a)/2;
}
function polygonPerimeter(pts){let p=0;for(let i=0;i<pts.length;i++)p+=haversine(pts[i].lat,pts[i].lon,pts[(i+1)%pts.length].lat,pts[(i+1)%pts.length].lon);return p}
function haversine(a,b,c,d){const R=6371008.8,r=Math.PI/180,dp=(c-a)*r,dl=(d-b)*r,x=Math.sin(dp/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(a,b,c,d){const r=Math.PI/180,p1=a*r,p2=c*r,dl=(d-b)*r,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (Math.atan2(y,x)/r+360)%360}
function cardinal(h){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(((h%360)+360)%360/45)%8]}

/* Sensors */
async function requestSensors(includeOrientation=true){
  if(navigator.geolocation&&requestSensors._watch==null){
    requestSensors._watch=navigator.geolocation.watchPosition(pos=>{
      state.gps={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,altitude:pos.coords.altitude||0};
      state.gpsUpdatedAt=Date.now();
      if(state.followGps)setMapViewAroundGps(state.gps);
      const waiters=state.gpsWaiters.splice(0);waiters.forEach(w=>{clearTimeout(w.timer);w.resolve(state.gps)});
      updateCoordPanel();updateNavigation();drawMap();updatePdfGps();
    },err=>{
      if(requestSensors._watch!=null){try{navigator.geolocation.clearWatch(requestSensors._watch)}catch(_){}}
      requestSensors._watch=null;if(err.code===1)state.gps=null;
      gpsBtn.classList.remove('locating');
      const waiters=state.gpsWaiters.splice(0);waiters.forEach(w=>{clearTimeout(w.timer);w.resolve(null)});
      toast('GPS: '+err.message);
    },{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  }
  if(!includeOrientation)return;
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const res=await DeviceOrientationEvent.requestPermission();state.orientationGranted=res==='granted';
    }else state.orientationGranted=true;
    if(state.orientationGranted&&!requestSensors._ori){
      window.addEventListener('deviceorientation',e=>{
        let h=typeof e.webkitCompassHeading==='number'?e.webkitCompassHeading:(360-(e.alpha||0));
        state.heading=(h+360)%360;updateNavigation();
      },true);requestSensors._ori=true;
    }
  }catch(_){}
}
function updatePdfGps(){
  if(!state.gps||!$('#pdfGps'))return;
  $('#pdfGps').textContent=coordFormat(state.gps.latitude,state.gps.longitude,state.settings.coordPrimary);
  if($('#pdfGpsSecondary'))$('#pdfGpsSecondary').textContent=state.settings.coordSecondaryEnabled?coordFormat(state.gps.latitude,state.gps.longitude,state.settings.coordSecondary):'';
  if($('#pdfAccuracy'))$('#pdfAccuracy').textContent=`Precisão ± ${state.gps.accuracy.toFixed(1)} m`;
  if(state.activeGeoPdf?.following)focusGeoPdfOnGps(state.gps,true);
}

/* Settings */
function renderSettings(){
  openModal('Configurações',`
    <h3>Coordenadas</h3>
    ${selectRow('Principal','coordPrimary',[['utm','UTM'],['dms','Graus, minutos e segundos'],['dd','Graus decimais'],['ddm','Graus e minutos decimais']])}
    ${switchRow('Mostrar coordenada secundária','coordSecondaryEnabled')}
    ${selectRow('Secundária','coordSecondary',[['dms','Graus, minutos e segundos'],['dd','Graus decimais'],['utm','UTM'],['ddm','Graus e minutos decimais']])}
    ${selectRow('Datum','datum',[['sirgas2000','SIRGAS 2000'],['wgs84','WGS 84']])}
    ${switchRow('Fuso UTM automático','utmAuto')}
    <div class="form-row"><label>Fuso UTM manual</label><input id="utmZone" type="number" min="1" max="60" value="${state.settings.utmZone}"></div>
    <h3>Área</h3>
    ${selectRow('Unidade principal','areaPrimary',[['ha','Hectares'],['alq_sp','Alqueire paulista'],['alq_mg','Alqueirão / mineiro'],['m2','m²']])}
    ${switchRow('Mostrar unidade secundária','areaSecondaryEnabled')}
    ${selectRow('Unidade secundária','areaSecondary',[['alq_mg','Alqueirão / mineiro'],['alq_sp','Alqueire paulista'],['ha','Hectares'],['m2','m²']])}
    <div class="form-row"><label>Casas decimais</label><select id="areaDecimals">${[2,3,4,5,6].map(n=>`<option ${n==state.settings.areaDecimals?'selected':''}>${n}</option>`).join('')}</select></div>
    <h3>Foto</h3>
    ${switchRow('Mostrar altitude','showAltitudeOnPhoto')}
    ${switchRow('Solicitar salvamento no celular após fotografar','autoSaveToDevice')}
    <div class="note">“Mostrar coordenada secundária” controla também o carimbo da foto. No iPhone, o navegador abre o menu do sistema e você deve escolher “Salvar Imagem”; uma página web não pode gravar silenciosamente na galeria.</div>
    <br><button id="saveSettings" class="primary">Salvar</button>`);
  $('#saveSettings').onclick=()=>{
    ['coordPrimary','coordSecondary','datum','areaPrimary','areaSecondary'].forEach(k=>state.settings[k]=$('#'+k).value);
    ['coordSecondaryEnabled','utmAuto','areaSecondaryEnabled','showAltitudeOnPhoto','autoSaveToDevice'].forEach(k=>state.settings[k]=$('#'+k).checked);
    state.settings.showSecondaryOnPhoto=state.settings.coordSecondaryEnabled;
    state.settings.utmZone=+$('#utmZone').value||21;state.settings.areaDecimals=+$('#areaDecimals').value||4;saveState();modal.close();renderProjectOrHome();toast('Configurações salvas');
  };
}
function selectRow(label,key,opts){return `<div class="form-row"><label>${label}</label><select id="${key}">${opts.map(([v,t])=>`<option value="${v}" ${state.settings[key]===v?'selected':''}>${t}</option>`).join('')}</select></div>`}
function switchRow(label,key){return `<div class="switch-row"><span>${label}</span><input id="${key}" type="checkbox" ${state.settings[key]?'checked':''}></div>`}
function renderProjectOrHome(){state.currentProjectId?renderProject():renderHome()}

/* IndexedDB */
const DB='lima-field-db',VER=1;
const memoryDb={files:new Map(),photos:new Map()};let idbDisabled=false;
function dbOpen(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej(new Error('IndexedDB indisponível'));const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'key'});if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(store,val){
  memoryDb[store].set(val.key,val);if(idbDisabled)return false;
  try{const db=await dbOpen();await new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});return true}catch(_){idbDisabled=true;return false}
}
async function idbGet(store,key){
  if(!idbDisabled)try{const db=await dbOpen(),item=await new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(item)return item}catch(_){idbDisabled=true}
  return memoryDb[store].get(key);
}
async function idbListByPrefix(store,prefix){
  let items=[];if(!idbDisabled)try{const db=await dbOpen();items=await new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(_){idbDisabled=true}
  const merged=new Map(items.map(x=>[x.key,x]));for(const [key,val] of memoryDb[store])if(key.startsWith(prefix))merged.set(key,val);return [...merged.values()].filter(x=>x.key.startsWith(prefix));
}

function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}


window.addEventListener('resize',()=>{const c=$('#fieldCanvas');if(c){fitCanvas(c);drawMap()}if(state.gps&&state.activeGeoPdf?.following)focusGeoPdfOnGps(state.gps,true)});
renderHome();

</script>
